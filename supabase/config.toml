project_id = "hundavaent"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:4173/is",
  "http://127.0.0.1:4173/en",
  "http://127.0.0.1:4173/is/auth/callback",
  "http://127.0.0.1:4173/en/auth/callback",
  "http://127.0.0.1:5173/is/auth/callback",
  "http://127.0.0.1:5173/en/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# Local browser suites exercise many independent identity boundaries in one run.
email_sent = 100
sign_in_sign_ups = 100
token_refresh = 300
token_verifications = 100

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[analytics]
enabled = false

[edge_runtime]
enabled = false
