name: Hundavaent preview

on:
  workflow_dispatch:

concurrency:
  group: hundavaent-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy isolated preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    outputs:
      preview_url: ${{ steps.verify.outputs.url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HUNDAVAENT_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.HUNDAVAENT_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: hundavaent
      CLOUDFLARE_PREVIEW_BRANCH: preview
      PREVIEW_URL: https://preview.hundavaent.pages.dev
      SUPABASE_ACCESS_TOKEN: ${{ secrets.HUNDAVAENT_PREVIEW_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.HUNDAVAENT_PREVIEW_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PREVIEW_SUPABASE_PROJECT_REF }}
      PUBLIC_SUPABASE_URL: ${{ vars.HUNDAVAENT_PREVIEW_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HUNDAVAENT_PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.HUNDAVAENT_PREVIEW_SUPABASE_SECRET_KEY }}
      PUBLIC_MAP_STYLE_URL: ${{ secrets.HUNDAVAENT_PREVIEW_MAP_STYLE_URL }}
      PUBLIC_APP_URL: https://preview.hundavaent.pages.dev
      PUBLIC_POSTHOG_TOKEN: ${{ vars.HUNDAVAENT_PREVIEW_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      POSTHOG_API_KEY: ${{ secrets.HUNDAVAENT_PREVIEW_POSTHOG_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.HUNDAVAENT_PREVIEW_POSTHOG_PROJECT_ID }}
      POSTHOG_HOST: https://eu.i.posthog.com
      APP_ENVIRONMENT: preview
      APP_RELEASE: ${{ github.sha }}
      EVALUATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate isolated preview inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_REF
            PUBLIC_SUPABASE_URL
            PUBLIC_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SECRET_KEY
            PUBLIC_MAP_STYLE_URL
            PUBLIC_APP_URL
            APP_ENVIRONMENT
            APP_RELEASE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required preview input: ${name}" >&2
              exit 1
            fi
          done
          if [[ "${PUBLIC_SUPABASE_URL}" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo "The Supabase URL does not match the dedicated preview project ref." >&2
            exit 1
          fi
          if [[ "${PUBLIC_MAP_STYLE_URL}" != https://api.maptiler.com/* ]] || [[ "${PUBLIC_MAP_STYLE_URL}" != *"?key="* && "${PUBLIC_MAP_STYLE_URL}" != *"&key="* ]]; then
            echo "The preview map style must use an authenticated MapTiler URL." >&2
            exit 1
          fi
          if [[ "${PUBLIC_APP_URL}" != "${PREVIEW_URL}" ]]; then
            echo "The authentication callback origin must use the stable Hundavaent preview URL." >&2
            exit 1
          fi
          if [[ "${PUBLIC_SUPABASE_URL,,}" == *fundid* ]] || [[ "${PUBLIC_APP_URL,,}" == *fundid* ]]; then
            echo "Fundid resources are not valid Hundavaent preview inputs." >&2
            exit 1
          fi

      - name: Check and build the Cloudflare artifact
        run: pnpm check && pnpm build

      - name: Ensure the dedicated Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          projects_file="${RUNNER_TEMP}/cloudflare-pages-projects.json"
          pnpm exec wrangler pages project list --json > "${projects_file}"
          if ! jq -e --arg name "${CLOUDFLARE_PAGES_PROJECT}" '
            if type == "array" then
              any(.[]; .name == $name)
            elif type == "object" and has("result") then
              any(.result[]; .name == $name)
            else
              false
            end
          ' "${projects_file}" > /dev/null; then
            pnpm exec wrangler pages project create "${CLOUDFLARE_PAGES_PROJECT}" \
              --production-branch main \
              --compatibility-date 2026-07-09 \
              --compatibility-flag nodejs_compat
          fi

      - name: Configure encrypted preview runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/hundavaent-pages-preview-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          jq -n \
            --arg supabase_url "${PUBLIC_SUPABASE_URL}" \
            --arg supabase_key "${PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --arg supabase_secret_key "${SUPABASE_SECRET_KEY}" \
            --arg map_style_url "${PUBLIC_MAP_STYLE_URL}" \
            --arg app_url "${PUBLIC_APP_URL}" \
            --arg posthog_token "${PUBLIC_POSTHOG_TOKEN}" \
            --arg posthog_host "${PUBLIC_POSTHOG_HOST}" \
            --arg app_environment "${APP_ENVIRONMENT}" \
            --arg app_release "${APP_RELEASE}" \
            '{
              PUBLIC_SUPABASE_URL: $supabase_url,
              PUBLIC_SUPABASE_PUBLISHABLE_KEY: $supabase_key,
              SUPABASE_SECRET_KEY: $supabase_secret_key,
              PUBLIC_MAP_STYLE_URL: $map_style_url,
              PUBLIC_APP_URL: $app_url,
              PUBLIC_POSTHOG_TOKEN: $posthog_token,
              PUBLIC_POSTHOG_HOST: $posthog_host,
              APP_ENVIRONMENT: $app_environment,
              APP_RELEASE: $app_release
            }' > "${secrets_file}"
          chmod 600 "${secrets_file}"
          pnpm exec wrangler pages secret bulk "${secrets_file}" \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}" \
            --env preview

      - name: Apply migrations to the dedicated preview database
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase link \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}" \
            --yes
          pnpm exec supabase db push \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}" \
            --dry-run \
            --yes
          pnpm exec supabase db push \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}" \
            --yes

      - name: Deploy the preview branch
        run: |
          pnpm exec wrangler pages deploy .svelte-kit/cloudflare \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}" \
            --branch "${CLOUDFLARE_PREVIEW_BRANCH}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Hundavaent preview" \
            --upload-source-maps

      - name: Verify preview health and publish its URL
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/wait-for-health.ts "${PREVIEW_URL}/api/health"
          health_json="$(curl --fail --silent --show-error "${PREVIEW_URL}/api/health")"
          jq -e '
            .service == "hundavaent" and
            .status == "ok" and
            .checks.database == "ready" and
            .checks.map == "configured" and
            .checks.translations == "drifted"
          ' <<< "${health_json}" > /dev/null
          curl --head --silent --show-error "${PREVIEW_URL}" | grep -qi '^x-robots-tag:.*noindex'
          echo "url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Hundavaent preview"
            echo
            echo "- URL: ${PREVIEW_URL}"
            echo "- Health: ready"
            echo "- Interface translations: bundled JSON authoritative; database mirror not synchronized"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
