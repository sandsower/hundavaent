name: Clean evaluation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact release candidate commit SHA (full 40 characters)'
        required: true
        type: string

concurrency:
  group: evaluation-${{ github.workflow }}-${{ inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static:
    name: Static, unit, and build proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      RELEASE_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify the exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked-out HEAD does not match the requested release SHA." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run static evaluation lane
        run: pnpm eval:release -- --lane static --sha "${RELEASE_SHA}"
      - name: Retain static lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-lane-static-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          retention-days: 2

  runtime:
    name: ${{ matrix.label }} proof
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: database
            label: Database
            supabase: true
            chrome: false
            timeout: 15
          - lane: e2e
            label: End-to-end
            supabase: true
            chrome: true
            timeout: 25
          - lane: a11y
            label: Accessibility
            supabase: true
            chrome: true
            timeout: 25
          - lane: visual
            label: Visual
            supabase: true
            chrome: true
            timeout: 30
          - lane: map
            label: Component and map
            supabase: false
            chrome: true
            timeout: 15
          - lane: performance
            label: Performance
            supabase: true
            chrome: true
            timeout: 20
    env:
      CI: '1'
      RELEASE_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify the exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked-out HEAD does not match the requested release SHA." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure isolated lane runtime
        run: >-
          node --experimental-strip-types scripts/configure-evaluation-lane.ts
          "${{ matrix.lane }}" --github-env "${GITHUB_ENV}"
      - name: Ensure Chrome and ffmpeg for Playwright
        if: ${{ matrix.chrome }}
        shell: bash
        run: |
          set -euo pipefail
          if google-chrome --version; then
            echo "Reusing the runner's preinstalled Chrome"
            pnpm exec playwright install ffmpeg
          else
            pnpm exec playwright install --with-deps chrome ffmpeg
          fi
      - name: Start isolated Supabase (retry once on transient Docker failures)
        if: ${{ matrix.supabase }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase start || {
            echo "First start failed; cleaning up and retrying once"
            pnpm exec supabase stop --no-backup || true
            sleep 10
            pnpm exec supabase start
          }
      - name: Run ${{ matrix.lane }} evaluation lane
        run: pnpm eval:release -- --lane "${{ matrix.lane }}" --sha "${RELEASE_SHA}"
      - name: Retain ${{ matrix.lane }} lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-lane-${{ matrix.lane }}-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          retention-days: 2

  verdict:
    name: Canonical release proof
    needs: [static, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      RELEASE_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify the exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked-out HEAD does not match the requested release SHA." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download every evaluation lane
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: evaluation-lane-*-${{ github.run_id }}
          path: test-results
          merge-multiple: true
      - name: Assemble exact-SHA verdict
        run: pnpm eval:release -- --aggregate --sha "${RELEASE_SHA}"
      - name: Retain complete evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: error
          retention-days: 14
