name: Hundavaent production

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact verified commit SHA to deploy (full 40 characters)'
        required: true
        type: string
      migrate:
        description: 'Apply migrations after the tested recovery point'
        required: false
        type: boolean
        default: true
      deploy:
        description: 'Deploy to Cloudflare Pages after migrating (requires HUNDAVAENT_CLOUDFLARE_API_TOKEN)'
        required: false
        type: boolean
        default: false
      activate_achievement_milestones:
        description: 'Activate the approved milestone policy for an exact SHA already live in production'
        required: false
        type: boolean
        default: false
      activate_trusted_contributor:
        description: 'Activate the approved Trusted Contributor policy for an exact SHA already live in production'
        required: false
        type: boolean
        default: false

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}

concurrency:
  group: hundavaent-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recovery-point:
    name: Dump production and prove restore
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    services:
      restore-db:
        image: supabase/postgres:17.6.1.141
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BACKUP_PASSPHRASE: ${{ secrets.HUNDAVAENT_PRODUCTION_BACKUP_PASSPHRASE }}
      AUTH_EMAIL_ENABLED: ${{ vars.HUNDAVAENT_PRODUCTION_AUTH_EMAIL_ENABLED }}
      AUTH_FACEBOOK_ENABLED: ${{ vars.HUNDAVAENT_PRODUCTION_AUTH_FACEBOOK_ENABLED }}
      SUPABASE_DB_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_PROJECT_REF }}
      # Session-mode pooler for the production project; GitHub runners have no IPv6
      # route to the direct db.<ref>.supabase.co host.
      SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
      RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Require a full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Input sha must be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked-out HEAD does not match the requested SHA." >&2
            exit 1
          fi
          if [[ ${#BACKUP_PASSPHRASE} -lt 32 ]] || \
              [[ ! "${BACKUP_PASSPHRASE}" =~ [^[:space:]] ]]; then
            echo "The production backup passphrase must be a high-entropy value of at least 32 characters." >&2
            exit 1
          fi
          if [[ "${AUTH_EMAIL_ENABLED}" != "false" || \
              "${AUTH_FACEBOOK_ENABLED}" != "false" ]]; then
            echo "Production Auth providers must remain disabled while managed Auth recovery is excluded." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dump production roles, schema, and data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          postgres_dump_image="public.ecr.aws/supabase/postgres:17.6.1.143@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453"
          recovery_snapshot_input="${RUNNER_TEMP}/hundavaent-recovery-snapshot-${GITHUB_RUN_ID}.in"
          recovery_snapshot_output="${RUNNER_TEMP}/hundavaent-recovery-snapshot-${GITHUB_RUN_ID}.out"
          recovery_snapshot_pid=""
          recovery_snapshot_active="false"
          recovery_snapshot=""
          cleanup_recovery_snapshot() {
            set +e
            if [[ "${recovery_snapshot_active}" == "true" ]]; then
              printf 'ROLLBACK;\n\\q\n' >&9
              exec 9>&-
              wait "${recovery_snapshot_pid}"
            fi
            rm -f "${recovery_snapshot_input}" "${recovery_snapshot_output}"
          }
          export_recovery_snapshot() {
            mkfifo "${recovery_snapshot_input}" "${recovery_snapshot_output}"
            psql -X -qAt -v ON_ERROR_STOP=1 "$1" \
              < "${recovery_snapshot_input}" > "${recovery_snapshot_output}" \
              2> recovery/production-snapshot.log &
            recovery_snapshot_pid="$!"
            exec 9> "${recovery_snapshot_input}"
            recovery_snapshot_active="true"
            cat >&9 <<'RECOVERY_SNAPSHOT_SQL'
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SELECT pg_export_snapshot();
          RECOVERY_SNAPSHOT_SQL
            if ! IFS= read -r recovery_snapshot < "${recovery_snapshot_output}" || \
                [[ ! "${recovery_snapshot}" =~ ^[0-9A-Fa-f-]+$ ]]; then
              cat recovery/production-snapshot.log >&2
              echo "Could not export a consistent production recovery snapshot." >&2
              return 1
            fi
          }
          release_recovery_snapshot() {
            printf 'COMMIT;\n\\q\n' >&9
            exec 9>&-
            recovery_snapshot_active="false"
            if ! wait "${recovery_snapshot_pid}"; then
              cat recovery/production-snapshot.log >&2
              echo "Could not commit the production recovery snapshot transaction." >&2
              return 1
            fi
            rm -f "${recovery_snapshot_input}" "${recovery_snapshot_output}"
          }
          snapshot_query() {
            local query="$1"
            psql -X -qAt -F ' ' -v ON_ERROR_STOP=1 \
              -v recovery_snapshot="${recovery_snapshot}" "${db_url}" <<SQL
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SET TRANSACTION SNAPSHOT :'recovery_snapshot';
          SET LOCAL ROLE postgres;
          ${query};
          COMMIT;
          SQL
          }
          dump_snapshot_data() {
            local schemas="$1"
            local output="$2"
            local exclusion_args=()
            if [[ "${schemas}" == "public|private|security" ]]; then
              test -s recovery/auth-hard-excluded-tables.txt
              test -s recovery/auth-neutralized-references.txt
              test -s recovery/auth-recovery-check-relaxations.txt
              while IFS= read -r table; do
                exclusion_args+=("--exclude-table-data=${table}")
              done < recovery/auth-hard-excluded-tables.txt
            fi
            {
              printf 'SET session_replication_role = replica;\n\n'
              docker run --rm "${postgres_dump_image}" pg_dump \
                --dbname "${db_url}" \
                --data-only \
                --quote-all-identifier \
                --role "postgres" \
                --exclude-schema "" \
                --schema "${schemas}" \
                "${exclusion_args[@]}" \
                --snapshot "${recovery_snapshot}" | \
                sed -E 's/^\\(un)?restrict .*$/-- &/'
              if [[ "${schemas}" == "public|private|security" ]]; then
                printf '\n-- Neutralize retained references to disposable Auth identity rows.\n'
                while IFS='|' read -r table constraint_name; do
                  schema="${table%%.*}"
                  relation="${table#*.}"
                  printf 'ALTER TABLE "%s"."%s" DROP CONSTRAINT "%s";\n' \
                    "${schema}" "${relation}" "${constraint_name}"
                done < recovery/auth-recovery-check-relaxations.txt
                while IFS='|' read -r table column _; do
                  schema="${table%%.*}"
                  relation="${table#*.}"
                  if [[ "${table}.${column}" == "private.place_media.uploaded_by" ]]; then
                    printf 'ALTER TABLE "private"."place_media" ALTER COLUMN "uploaded_by" DROP NOT NULL;\n'
                  fi
                  printf 'UPDATE "%s"."%s" SET "%s" = NULL WHERE "%s" IS NOT NULL;\n' \
                    "${schema}" "${relation}" "${column}" "${column}"
                done < recovery/auth-neutralized-references.txt
              fi
              printf '\nRESET ALL;\n'
            } > "${output}"
          }
          dump_snapshot_schema() {
            local schemas="$1"
            local output="$2"
            docker run --rm "${postgres_dump_image}" pg_dump \
              --dbname "${db_url}" \
              --schema-only \
              --quote-all-identifier \
              --role "postgres" \
              --schema "${schemas}" \
              --snapshot "${recovery_snapshot}" | \
              sed -E 's/^\\(un)?restrict .*$/-- &/' > "${output}"
          }
          trap cleanup_recovery_snapshot EXIT
          docker run --rm "${postgres_dump_image}" pg_dump --version
          pnpm exec supabase db dump --db-url "${db_url}" --role-only -f recovery/roles.sql
          pnpm exec supabase db dump --db-url "${db_url}" -f recovery/schema.sql
          export_recovery_snapshot "${db_url}"
          hard_auth_tables_cte="
            with recursive hard_auth_tables(table_oid) as (
              select 'auth.users'::regclass::oid
              union
              select constraint_row.conrelid
              from hard_auth_tables hard_parent
              join pg_constraint constraint_row
                on constraint_row.contype = 'f'
               and constraint_row.confrelid = hard_parent.table_oid
              join pg_class child on child.oid = constraint_row.conrelid
              join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
              where child_namespace.nspname in ('public', 'private', 'security')
                and not (
                  child_namespace.nspname = 'private' and
                  child.relname = 'place_media' and
                  cardinality(constraint_row.conkey) = 1 and
                  constraint_row.conkey[1] = (
                    select attnum from pg_attribute
                    where attrelid = constraint_row.conrelid and attname = 'uploaded_by'
                  )
                )
                and not exists (
                  select 1
                  from unnest(constraint_row.conkey) as key_column(attnum)
                  join pg_attribute attribute_row
                    on attribute_row.attrelid = constraint_row.conrelid
                   and attribute_row.attnum = key_column.attnum
                  where not attribute_row.attnotnull
                )
            )"
          snapshot_query "
            ${hard_auth_tables_cte}
            select child_namespace.nspname || '.' || child.relname
            from hard_auth_tables hard_table
            join pg_class child on child.oid = hard_table.table_oid
            join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
            where child_namespace.nspname in ('public', 'private', 'security')
            order by 1" > recovery/auth-hard-excluded-tables.txt
          if [[ ! -s recovery/auth-hard-excluded-tables.txt ]] || \
              ! grep -Fxq 'private.member_accounts' recovery/auth-hard-excluded-tables.txt || \
              grep -Fxq 'private.places' recovery/auth-hard-excluded-tables.txt || \
              grep -Fxq 'private.place_media' recovery/auth-hard-excluded-tables.txt; then
            echo "Could not derive the safe hard Auth-dependent table boundary." >&2
            exit 1
          fi
          composite_boundary_count="$(snapshot_query "
            ${hard_auth_tables_cte}
            select count(*)
            from hard_auth_tables hard_parent
            join pg_constraint constraint_row
              on constraint_row.contype = 'f'
             and constraint_row.confrelid = hard_parent.table_oid
            join pg_class child on child.oid = constraint_row.conrelid
            join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
            where child_namespace.nspname in ('public', 'private', 'security')
              and (
                cardinality(constraint_row.conkey) <> 1 or
                cardinality(constraint_row.confkey) <> 1
              )")"
          if [[ "${composite_boundary_count}" != "0" ]]; then
            echo "Composite foreign keys cross the disposable Auth recovery boundary." >&2
            exit 1
          fi
          snapshot_query "
            ${hard_auth_tables_cte}
            select child_namespace.nspname || '.' || child.relname || '|' ||
              child_attribute.attname || '|' || constraint_row.conname
            from hard_auth_tables hard_parent
            join pg_constraint constraint_row
              on constraint_row.contype = 'f'
             and constraint_row.confrelid = hard_parent.table_oid
            join pg_class child on child.oid = constraint_row.conrelid
            join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
            join pg_attribute child_attribute
              on child_attribute.attrelid = child.oid
             and child_attribute.attnum = constraint_row.conkey[1]
            where child_namespace.nspname in ('public', 'private', 'security')
              and child.oid not in (select table_oid from hard_auth_tables)
              and cardinality(constraint_row.conkey) = 1
              and cardinality(constraint_row.confkey) = 1
              and (
                not child_attribute.attnotnull or
                (
                  child_namespace.nspname = 'private' and
                  child.relname = 'place_media' and
                  child_attribute.attname = 'uploaded_by'
                )
              )
            order by 1" > recovery/auth-neutralized-reference-contracts.txt
          : > recovery/auth-neutralized-references.txt
          while IFS='|' read -r table column constraint_name; do
            if [[ ! "${table}" =~ ^(public|private|security)\.[a-z][a-z0-9_]*$ ]] || \
                [[ ! "${column}" =~ ^[a-z][a-z0-9_]*$ ]] || \
                [[ ! "${constraint_name}" =~ ^[a-z][a-z0-9_]*$ ]]; then
              echo "Unsafe identifier reached the Auth neutralization boundary." >&2
              exit 1
            fi
            neutralized_rows="$(snapshot_query \
              "select count(*) from ${table} where ${column} is not null")"
            echo "${table}|${column}|${neutralized_rows}" \
              >> recovery/auth-neutralized-references.txt
          done < recovery/auth-neutralized-reference-contracts.txt
          if [[ ! -s recovery/auth-neutralized-references.txt ]] || \
              ! grep -Eq '^private\.places\|created_by\|[0-9]+$' \
                recovery/auth-neutralized-references.txt || \
              ! grep -Eq '^private\.place_media\|uploaded_by\|[0-9]+$' \
                recovery/auth-neutralized-references.txt; then
            echo "Could not derive required nullable Auth attribution neutralizations." >&2
            exit 1
          fi
          snapshot_query "
            ${hard_auth_tables_cte},
            neutralized_auth_columns as (
              select constraint_row.conrelid, constraint_row.conkey[1] as attnum
              from hard_auth_tables hard_parent
              join pg_constraint constraint_row
                on constraint_row.contype = 'f'
               and constraint_row.confrelid = hard_parent.table_oid
              join pg_class child on child.oid = constraint_row.conrelid
              join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
              join pg_attribute child_attribute
                on child_attribute.attrelid = child.oid
               and child_attribute.attnum = constraint_row.conkey[1]
              where child_namespace.nspname in ('public', 'private', 'security')
                and child.oid not in (select table_oid from hard_auth_tables)
                and cardinality(constraint_row.conkey) = 1
                and cardinality(constraint_row.confkey) = 1
                and (
                  not child_attribute.attnotnull or
                  (
                    child_namespace.nspname = 'private' and
                    child.relname = 'place_media' and
                    child_attribute.attname = 'uploaded_by'
                  )
                )
            )
            select distinct child_namespace.nspname || '.' || child.relname || '|' ||
              check_constraint.conname
            from neutralized_auth_columns f
            join pg_constraint check_constraint
              on check_constraint.conrelid = f.conrelid
             and check_constraint.contype = 'c'
             and f.attnum = any(check_constraint.conkey)
            join pg_class child on child.oid = check_constraint.conrelid
            join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
            order by 1" > recovery/auth-recovery-check-relaxations.txt
          while IFS='|' read -r table constraint_name; do
            if [[ ! "${table}" =~ ^(public|private|security)\.[a-z][a-z0-9_]*$ ]] || \
                [[ ! "${constraint_name}" =~ ^[a-z][a-z0-9_]*$ ]]; then
              echo "Unsafe identifier reached the Auth check-relaxation boundary." >&2
              exit 1
            fi
          done < recovery/auth-recovery-check-relaxations.txt
          if [[ ! -s recovery/auth-recovery-check-relaxations.txt ]] || \
              ! grep -Fxq \
                'private.place_media|place_media_approval_requires_metadata_check' \
                recovery/auth-recovery-check-relaxations.txt || \
              ! grep -Fxq \
                'private.auth_pending_intents|auth_pending_intent_lifecycle_check' \
                recovery/auth-recovery-check-relaxations.txt; then
            echo "Could not derive required Auth-dependent check relaxations." >&2
            exit 1
          fi
          production_uploaded_by_nullable="$(snapshot_query "
            select is_nullable
            from information_schema.columns
            where table_schema = 'private'
              and table_name = 'place_media'
              and column_name = 'uploaded_by'")"
          if [[ "${production_uploaded_by_nullable}" != "YES" && \
              "${production_uploaded_by_nullable}" != "NO" ]]; then
            echo "Could not prove the production Place media uploader nullability." >&2
            exit 1
          fi
          echo "private.place_media|uploaded_by|drop_not_null|${production_uploaded_by_nullable}" \
            > recovery/auth-recovery-schema-relaxations.txt
          : > recovery/auth-hard-excluded-counts.txt
          while IFS= read -r table; do
            echo "${table} $(snapshot_query "select count(*) from ${table}")"
          done < recovery/auth-hard-excluded-tables.txt \
            > recovery/auth-hard-excluded-counts.txt
          dump_snapshot_data "public|private|security" recovery/data.sql
          test "$(grep -Ec '^ALTER TABLE .* DROP NOT NULL;$' recovery/data.sql)" -eq 1
          test "$(grep -Ec '^ALTER TABLE .* DROP CONSTRAINT .*;$' recovery/data.sql)" -eq \
            "$(wc -l < recovery/auth-recovery-check-relaxations.txt)"
          grep -Fxq \
            'ALTER TABLE "private"."place_media" ALTER COLUMN "uploaded_by" DROP NOT NULL;' \
            recovery/data.sql
          grep -Fxq \
            'ALTER TABLE "private"."place_media" DROP CONSTRAINT "place_media_approval_requires_metadata_check";' \
            recovery/data.sql
          # Hard identity-owned rows are disposable pre-launch test state. Core application rows
          # survive with nullable identity attribution deterministically neutralized.
          dump_snapshot_schema "storage" recovery/storage-schema.sql
          dump_snapshot_data "storage" recovery/storage-data.sql
          snapshot_query "
            select n.nspname || '.' || c.relname
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where c.relkind = 'r'
              and n.nspname = 'storage'" |
            while read -r table; do
              echo "${table} $(snapshot_query "select count(*) from ${table}")"
            done | sort > recovery/storage-production-counts.txt
          node --experimental-strip-types scripts/verify-recovery-copy-dump.ts \
            recovery/storage-data.sql recovery/storage-production-counts.txt \
            recovery/storage-dump-counts.txt
          snapshot_query "
            select 'column ' || table_schema || '.' || table_name || '.' || column_name ||
              ' ' || udt_schema || '.' || udt_name || ' ' || is_nullable
            from information_schema.columns
            where table_schema = 'storage'
            union all
            select 'policy ' || schemaname || '.' || tablename || '.' || policyname ||
              ' ' || permissive || ' ' || array_to_string(roles, ',') || ' ' || cmd ||
              ' ' || quote_nullable(qual) || ' ' || quote_nullable(with_check)
            from pg_policies
            where schemaname = 'storage'
            order by 1" > recovery/storage-production-schema.txt
          if [[ ! -s recovery/storage-production-counts.txt ]] || \
              [[ ! -s recovery/storage-dump-counts.txt ]] || \
              [[ ! -s recovery/storage-production-schema.txt ]] || \
              ! grep -Eq '^column storage\.objects\.' \
                recovery/storage-production-schema.txt; then
            echo "Storage recovery proof is incomplete." >&2
            exit 1
          fi
          # Exact per-table production counts for the dumped schemas; the
          # verify step fails if the dump does not cover every one of them.
          snapshot_query "
            select n.nspname || '.' || c.relname
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where c.relkind = 'r' and n.nspname in ('public', 'private', 'security')" |
            while read -r table; do
              if grep -Fxq "${table}" recovery/auth-hard-excluded-tables.txt; then
                continue
              fi
              echo "${table} $(snapshot_query "select count(*) from ${table}")"
            done | sort > recovery/production-counts.txt
          node --experimental-strip-types scripts/verify-recovery-copy-dump.ts \
            recovery/data.sql recovery/production-counts.txt recovery/dump-counts.txt
          release_recovery_snapshot
          cat recovery/production-counts.txt
          ls -l recovery

      - name: Restore the dump into a scratch database
        shell: bash
        run: |
          set -euo pipefail
          # Role creation tolerates roles the supabase image already ships.
          psql "${RESTORE_DB_URL}" -f recovery/roles.sql || true
          if [[ ! -s recovery/storage-schema.sql ]] || \
              [[ ! -s recovery/storage-data.sql ]] || \
              [[ ! -s recovery/storage-production-counts.txt ]] || \
              [[ ! -s recovery/storage-dump-counts.txt ]] || \
              [[ ! -s recovery/storage-production-schema.txt ]]; then
            echo "Required Storage recovery proof is missing or incomplete." >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 "${RESTORE_DB_URL}?user=supabase_admin" \
            -c 'alter schema storage rename to scratch_storage'
          psql -v ON_ERROR_STOP=1 "${RESTORE_DB_URL}" -f recovery/schema.sql
          psql -v ON_ERROR_STOP=1 "${RESTORE_DB_URL}?user=supabase_admin" \
            -f recovery/storage-schema.sql
          psql -v ON_ERROR_STOP=1 "${RESTORE_DB_URL}?user=supabase_admin" \
            -f recovery/storage-data.sql
          psql -v ON_ERROR_STOP=1 "${RESTORE_DB_URL}?user=supabase_admin" \
            -f recovery/data.sql

      - name: Verify restored row counts match the dump
        shell: bash
        run: |
          set -euo pipefail
          # Dump counts were parsed and matched against production while the
          # recovery write lock was still held.
          test -s recovery/dump-counts.txt
          recovery_db_url="${RESTORE_DB_URL}"
          psql -At "${recovery_db_url}" -c "
            select schemaname || '.' || relname || ' ' || n_live_tup
            from pg_stat_user_tables" |
            awk '{ print $1, $2 }' | sort > recovery/restored-counts-raw.txt
          # pg_stat estimates lag; recount exactly for the tables the dump names.
          : > recovery/restored-counts.txt
          while read -r table _; do
            actual="$(psql -At "${recovery_db_url}" -c "select count(*) from ${table}")"
            echo "${table} ${actual}" >> recovery/restored-counts.txt
          done < recovery/dump-counts.txt
          if ! diff -u recovery/dump-counts.txt recovery/restored-counts.txt; then
            echo "Restored table counts do not match the dump." >&2
            exit 1
          fi
          : > recovery/auth-hard-excluded-restored-counts.txt
          while read -r table _; do
            actual="$(psql -At "${recovery_db_url}" -c "select count(*) from ${table}")"
            echo "${table} ${actual}" >> recovery/auth-hard-excluded-restored-counts.txt
            if [[ "${actual}" != "0" ]]; then
              echo "Hard Auth-dependent test data was restored for ${table}." >&2
              exit 1
            fi
          done < recovery/auth-hard-excluded-counts.txt
          excluded_oids="$(
            cut -d' ' -f1 recovery/auth-hard-excluded-counts.txt |
              sed "s/.*/'&'::regclass/" | paste -sd, -
          )"
          hard_parent_oids="'auth.users'::regclass,${excluded_oids}"
          restored_composite_boundary_count="$(psql -At "${recovery_db_url}" -c "
            select count(*)
            from pg_constraint constraint_row
            join pg_class child on child.oid = constraint_row.conrelid
            join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
            where constraint_row.contype = 'f'
              and constraint_row.confrelid in (${hard_parent_oids})
              and constraint_row.conrelid not in (${excluded_oids})
              and child_namespace.nspname in ('public', 'private', 'security')
              and (
                cardinality(constraint_row.conkey) <> 1 or
                cardinality(constraint_row.confkey) <> 1
              )")"
          if [[ "${restored_composite_boundary_count}" != "0" ]]; then
            echo "A composite foreign key crosses the restored Auth boundary." >&2
            exit 1
          fi
          psql -At -F '|' "${recovery_db_url}" -c "
            select child_namespace.nspname || '.' || child.relname,
              child_attribute.attname,
              constraint_row.conname
            from pg_constraint constraint_row
            join pg_class child on child.oid = constraint_row.conrelid
            join pg_namespace child_namespace on child_namespace.oid = child.relnamespace
            join pg_attribute child_attribute
              on child_attribute.attrelid = child.oid
             and child_attribute.attnum = constraint_row.conkey[1]
            where constraint_row.contype = 'f'
              and constraint_row.confrelid in (${hard_parent_oids})
              and constraint_row.conrelid not in (${excluded_oids})
              and child_namespace.nspname in ('public', 'private', 'security')
              and cardinality(constraint_row.conkey) = 1
              and cardinality(constraint_row.confkey) = 1
              and not child_attribute.attnotnull
            order by 1, 2, 3" > recovery/auth-restored-neutralization-contracts.txt
          if ! diff -u recovery/auth-neutralized-reference-contracts.txt \
              recovery/auth-restored-neutralization-contracts.txt; then
            echo "The restored nullable Auth boundary differs from production." >&2
            exit 1
          fi
          : > recovery/auth-neutralized-restored-counts.txt
          while IFS='|' read -r table column expected_neutralized; do
            actual_nonnull="$(psql -At "${recovery_db_url}" \
              -c "select count(*) from ${table} where ${column} is not null")"
            echo "${table}|${column}|${actual_nonnull}" \
              >> recovery/auth-neutralized-restored-counts.txt
            if [[ "${actual_nonnull}" != "0" ]]; then
              echo "A retained Auth attribution was not neutralized for ${table}.${column}." >&2
              exit 1
            fi
            if [[ ! "${expected_neutralized}" =~ ^[0-9]+$ ]]; then
              echo "Invalid production neutralization count for ${table}.${column}." >&2
              exit 1
            fi
          done < recovery/auth-neutralized-references.txt
          while IFS='|' read -r table constraint_name; do
            if [[ ! "${table}" =~ ^(public|private|security)\.[a-z][a-z0-9_]*$ ]] || \
                [[ ! "${constraint_name}" =~ ^[a-z][a-z0-9_]*$ ]]; then
              echo "Unsafe identifier reached restored Auth check-relaxation proof." >&2
              exit 1
            fi
            schema="${table%%.*}"
            relation="${table#*.}"
            remaining_constraint="$(psql -At "${recovery_db_url}" -c "
              select count(*)
              from pg_constraint constraint_row
              join pg_class relation_row on relation_row.oid = constraint_row.conrelid
              join pg_namespace namespace_row on namespace_row.oid = relation_row.relnamespace
              where namespace_row.nspname = '${schema}'
                and relation_row.relname = '${relation}'
                and constraint_row.conname = '${constraint_name}'")"
            if [[ "${remaining_constraint}" != "0" ]]; then
              echo "A recovery-relaxed Auth-dependent check constraint remains installed." >&2
              exit 1
            fi
          done < recovery/auth-recovery-check-relaxations.txt
          if [[ "$(wc -l < recovery/auth-recovery-schema-relaxations.txt)" != "1" ]] || \
              ! grep -Eq '^private\.place_media\|uploaded_by\|drop_not_null\|(YES|NO)$' \
                recovery/auth-recovery-schema-relaxations.txt; then
            echo "Unexpected Auth recovery schema relaxation contract." >&2
            exit 1
          fi
          restored_uploaded_by_nullable="$(psql -At "${recovery_db_url}" -c "
            select is_nullable
            from information_schema.columns
            where table_schema = 'private'
              and table_name = 'place_media'
              and column_name = 'uploaded_by'")"
          if [[ "${restored_uploaded_by_nullable}" != "YES" ]]; then
            echo "Restored Place media uploader attribution is not nullable." >&2
            exit 1
          fi
          if ! grep -Eq '^private\.places [0-9]+$' recovery/restored-counts.txt || \
              ! grep -Eq '^private\.place_media [0-9]+$' recovery/restored-counts.txt; then
            echo "Core Place or Place media row-count proof is missing." >&2
            exit 1
          fi
          : > recovery/storage-restored-counts.txt
          while read -r table _; do
            actual="$(psql -At "${recovery_db_url}" -c "select count(*) from ${table}")"
            echo "${table} ${actual}" >> recovery/storage-restored-counts.txt
          done < recovery/storage-dump-counts.txt
          if ! diff -u recovery/storage-dump-counts.txt \
              recovery/storage-restored-counts.txt; then
            echo "Restored Storage table counts do not match the dump." >&2
            exit 1
          fi
          psql -X -qAt -F ' ' "${recovery_db_url}" \
            > recovery/storage-restored-schema.txt <<'SQL'
          select 'column ' || table_schema || '.' || table_name || '.' || column_name ||
            ' ' || udt_schema || '.' || udt_name || ' ' || is_nullable
          from information_schema.columns
          where table_schema = 'storage'
          union all
          select 'policy ' || schemaname || '.' || tablename || '.' || policyname ||
            ' ' || permissive || ' ' || array_to_string(roles, ',') || ' ' || cmd ||
            ' ' || quote_nullable(qual) || ' ' || quote_nullable(with_check)
          from pg_policies
          where schemaname = 'storage'
          order by 1;
          SQL
          if ! diff -u recovery/storage-production-schema.txt \
              recovery/storage-restored-schema.txt; then
            echo "Restored Storage schema does not match production." >&2
            exit 1
          fi
          tables="$(wc -l < recovery/dump-counts.txt)"
          rows="$(awk '{ sum += $2 } END { print sum + 0 }' recovery/dump-counts.txt)"
          echo "Restore verified: ${tables} tables, ${rows} rows."
          if [[ "${rows}" == "0" ]]; then
            echo "::warning::Production data dump contains zero rows."
          fi
          {
            echo "### Recovery point"
            echo
            echo "- Commit: ${RELEASE_SHA}"
            echo "- Tables: ${tables}"
            echo "- Rows: ${rows}"
            echo "- Storage schema/data: preserved and restore-tested"
            echo "- Managed Auth and hard identity-owned test rows: intentionally skipped"
            echo "- Retained nullable identity attribution: neutralized and restore-tested"
            echo "- Auth-dependent checks: explicitly relaxed and restore-tested"
            echo "- Restore test: passed against supabase/postgres:17.6.1.141"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Encrypt the restore-tested recovery point
        shell: bash
        run: |
          set -euo pipefail
          plaintext_archive="${RUNNER_TEMP}/hundavaent-recovery-${RELEASE_SHA}.tar.gz"
          ciphertext="retained-recovery/hundavaent-recovery-${RELEASE_SHA}.tar.gz.enc"
          manifest="retained-recovery/recovery-manifest.json"
          rm -rf retained-recovery
          mkdir -p retained-recovery
          hard_excluded_auth_tables="$(
            jq -Rn \
              '[inputs | split(" ") | {table: .[0], rows: (.[1] | tonumber)}]' \
              < recovery/auth-hard-excluded-counts.txt
          )"
          neutralized_auth_references="$(
            jq -Rn \
              '[inputs | split("|") | {table: .[0], column: .[1], rows: (.[2] | tonumber)}]' \
              < recovery/auth-neutralized-references.txt
          )"
          auth_recovery_schema_relaxations="$(
            jq -Rn \
              '[inputs | split("|") | {
                table: .[0],
                column: .[1],
                action: .[2],
                production_was_nullable: (.[3] == "YES")
              }]' < recovery/auth-recovery-schema-relaxations.txt
          )"
          auth_recovery_check_relaxations="$(
            jq -Rn \
              '[inputs | split("|") | {
                table: .[0],
                constraint: .[1],
                action: "drop_check"
              }]' < recovery/auth-recovery-check-relaxations.txt
          )"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cf - recovery | gzip -n -9 > "${plaintext_archive}"
          plaintext_archive_sha256="$(sha256sum "${plaintext_archive}" | cut -d' ' -f1)"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -pass env:BACKUP_PASSPHRASE \
            -in "${plaintext_archive}" \
            -out "${ciphertext}"
          ciphertext_sha256="$(sha256sum "${ciphertext}" | cut -d' ' -f1)"
          jq -n \
            --arg release_sha "${RELEASE_SHA}" \
            --arg plaintext_archive_sha256 "${plaintext_archive_sha256}" \
            --arg ciphertext_sha256 "${ciphertext_sha256}" \
            --argjson hard_excluded_auth_tables "${hard_excluded_auth_tables}" \
            --argjson neutralized_auth_references "${neutralized_auth_references}" \
            --argjson auth_recovery_schema_relaxations "${auth_recovery_schema_relaxations}" \
            --argjson auth_recovery_check_relaxations "${auth_recovery_check_relaxations}" \
            '{
              schema_version: 1,
              release_sha: $release_sha,
              format: "tar.gz",
              encryption: {
                algorithm: "AES-256-CBC",
                kdf: "PBKDF2-HMAC-SHA256",
                iterations: 600000,
                salt: true
              },
              plaintext_archive_sha256: $plaintext_archive_sha256,
              ciphertext_sha256: $ciphertext_sha256,
              managed_auth_mode: "excluded-prelaunch-auth-and-hard-identity-rows-providers-disabled",
              hard_excluded_auth_tables: $hard_excluded_auth_tables,
              neutralized_auth_references: $neutralized_auth_references,
              auth_recovery_schema_relaxations: $auth_recovery_schema_relaxations,
              auth_recovery_check_relaxations: $auth_recovery_check_relaxations
            }' > "${manifest}"
          rm -rf recovery
          rm -f "${plaintext_archive}"

      - name: Prove the retained recovery point contains no plaintext
        shell: bash
        run: |
          set -euo pipefail
          plaintext_archive="${RUNNER_TEMP}/hundavaent-recovery-${RELEASE_SHA}.tar.gz"
          test ! -e recovery
          test ! -e "${plaintext_archive}"
          test -s "retained-recovery/hundavaent-recovery-${RELEASE_SHA}.tar.gz.enc"
          test -s retained-recovery/recovery-manifest.json
          test "$(find retained-recovery -type f | wc -l)" -eq 2
          if find retained-recovery -type f \
              \( -name '*.sql' -o -name '*.log' -o -name '*.txt' -o -name '*.tar.gz' \
              -o -name 'roles*' -o -name '*counts*' \) | grep -q .; then
            echo "Plaintext recovery material reached the retained artifact directory." >&2
            exit 1
          fi
          if find retained-recovery -type f \
              ! -name "hundavaent-recovery-${RELEASE_SHA}.tar.gz.enc" \
              ! -name 'recovery-manifest.json' | grep -q .; then
            echo "Unexpected file reached the retained artifact directory." >&2
            exit 1
          fi
          jq -e \
            --arg release_sha "${RELEASE_SHA}" \
            '.release_sha == $release_sha and
             .format == "tar.gz" and
             .encryption.algorithm == "AES-256-CBC" and
             .encryption.kdf == "PBKDF2-HMAC-SHA256" and
             .encryption.iterations == 600000 and
             .managed_auth_mode == "excluded-prelaunch-auth-and-hard-identity-rows-providers-disabled" and
             (.hard_excluded_auth_tables | length > 0) and
             any(.hard_excluded_auth_tables[]; .table == "private.member_accounts") and
             all(.hard_excluded_auth_tables[]; .table != "private.places" and .table != "private.place_media") and
             any(.neutralized_auth_references[]; .table == "private.places" and .column == "created_by") and
             any(.neutralized_auth_references[]; .table == "private.place_media" and .column == "uploaded_by") and
             (.auth_recovery_schema_relaxations | length == 1) and
             .auth_recovery_schema_relaxations[0].table == "private.place_media" and
             .auth_recovery_schema_relaxations[0].column == "uploaded_by" and
             .auth_recovery_schema_relaxations[0].action == "drop_not_null" and
             (.auth_recovery_check_relaxations | length > 0) and
             all(.auth_recovery_check_relaxations[]; .action == "drop_check") and
             any(.auth_recovery_check_relaxations[];
               .table == "private.place_media" and
               .constraint == "place_media_approval_requires_metadata_check") and
             any(.auth_recovery_check_relaxations[];
               .table == "private.auth_pending_intents" and
               .constraint == "auth_pending_intent_lifecycle_check") and
             (.plaintext_archive_sha256 | test("^[0-9a-f]{64}$")) and
             (.ciphertext_sha256 | test("^[0-9a-f]{64}$"))' \
            retained-recovery/recovery-manifest.json > /dev/null
          test "$(sha256sum retained-recovery/*.enc | cut -d' ' -f1)" = \
            "$(jq -r '.ciphertext_sha256' retained-recovery/recovery-manifest.json)"

      - name: Retain the tested recovery point
        uses: actions/upload-artifact@v7
        with:
          name: recovery-point-${{ env.RELEASE_SHA }}
          path: retained-recovery/
          if-no-files-found: error
          retention-days: 90

  migrate:
    name: Apply migrations to production
    needs: recovery-point
    if: >-
      ${{
        github.event_name == 'workflow_run' ||
        (
          inputs.migrate &&
          !inputs.activate_achievement_milestones &&
          !inputs.activate_trusted_contributor
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
      MEMBER_ACTIVATION_SECRET: ${{ secrets.HUNDAVAENT_PRODUCTION_MEMBER_ACTIVATION_SECRET }}
      TRANSLATION_DATABASE_SECRET: ${{ secrets.HUNDAVAENT_PRODUCTION_TRANSLATION_DATABASE_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify the exact migration SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the production database
        shell: bash
        run: |
          set -euo pipefail
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          if [[ ! "${MEMBER_ACTIVATION_SECRET}" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "The Member activation secret must be high-entropy base64url." >&2
            exit 1
          fi
          if [[ ! "${TRANSLATION_DATABASE_SECRET}" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "The interface translation database secret must be high-entropy base64url." >&2
            exit 1
          fi
          translation_sql="${RUNNER_TEMP}/hundavaent-interface-translation-sync.sql"
          trap 'rm -f "${translation_sql}"' EXIT
          node --experimental-strip-types scripts/sync-interface-translation-inventory.ts \
            "${translation_sql}"
          pnpm exec supabase db push --db-url "${db_url}" --include-all --dry-run --yes
          pnpm exec supabase db push --db-url "${db_url}" --include-all --yes
          psql -v ON_ERROR_STOP=1 -v activation_secret="${MEMBER_ACTIVATION_SECRET}" "${db_url}" <<'SQL'
          select public.configure_member_activation_capability(:'activation_secret');
          SQL
          app_fingerprint="$(printf '%s' "${MEMBER_ACTIVATION_SECRET}" | sha256sum | cut -d' ' -f1)"
          db_fingerprint="$(psql -At "${db_url}" -c "select encode(extensions.digest(convert_to(secret, 'UTF8'), 'sha256'), 'hex') from private.member_activation_capabilities where singleton")"
          test "${app_fingerprint}" = "${db_fingerprint}"
          psql \
            -v ON_ERROR_STOP=1 \
            -v release_sha="${RELEASE_SHA}" \
            -f "${translation_sql}" \
            "${db_url}"
          translation_key_count="$(jq 'length' src/lib/i18n/messages/is.json)"
          {
            echo "### Production migrations"
            echo
            echo "- Commit: ${RELEASE_SHA}"
            echo "- Migrations applied after tested recovery point"
            echo "- Member activation capability fingerprint: ${app_fingerprint}"
            echo "- Published interface translation keys per locale: ${translation_key_count}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy production
    needs: migrate
    if: >-
      ${{
        github.event_name == 'workflow_run' ||
        (
          inputs.deploy &&
          !inputs.activate_achievement_milestones &&
          !inputs.activate_trusted_contributor
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.HUNDAVAENT_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.HUNDAVAENT_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.HUNDAVAENT_CLOUDFLARE_PAGES_PROJECT }}
      PRODUCTION_URL: ${{ vars.HUNDAVAENT_PRODUCTION_APP_URL }}
      PUBLIC_SUPABASE_URL: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HUNDAVAENT_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_MAP_STYLE_URL: ${{ secrets.HUNDAVAENT_PRODUCTION_MAP_STYLE_URL }}
      PUBLIC_APP_URL: ${{ vars.HUNDAVAENT_PRODUCTION_APP_URL }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.HUNDAVAENT_PRODUCTION_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      POSTHOG_API_KEY: ${{ secrets.HUNDAVAENT_PRODUCTION_POSTHOG_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.HUNDAVAENT_PRODUCTION_POSTHOG_PROJECT_ID }}
      POSTHOG_HOST: https://eu.i.posthog.com
      APP_ENVIRONMENT: production
      SITE_GATE_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SITE_GATE_PASSWORD }}
      TRANSLATION_WORKSPACE_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SITE_GATE_PASSWORD }}
      TRANSLATION_SESSION_SECRET: ${{ secrets.HUNDAVAENT_PRODUCTION_TRANSLATION_SESSION_SECRET }}
      TRANSLATION_DATABASE_SECRET: ${{ secrets.HUNDAVAENT_PRODUCTION_TRANSLATION_DATABASE_SECRET }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_PROJECT_REF }}
      EVALUATION_ENABLED: 'false'
      AUTH_EMAIL_ENABLED: ${{ vars.HUNDAVAENT_PRODUCTION_AUTH_EMAIL_ENABLED }}
      AUTH_FACEBOOK_ENABLED: ${{ vars.HUNDAVAENT_PRODUCTION_AUTH_FACEBOOK_ENABLED }}
      MEMBER_ACTIVATION_SECRET: ${{ secrets.HUNDAVAENT_PRODUCTION_MEMBER_ACTIVATION_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify the exact deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          echo "APP_RELEASE=${RELEASE_SHA}" >> "${GITHUB_ENV}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate production inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_PAGES_PROJECT
            SUPABASE_PROJECT_REF
            PUBLIC_SUPABASE_URL
            PUBLIC_SUPABASE_PUBLISHABLE_KEY
            PUBLIC_MAP_STYLE_URL
            PUBLIC_APP_URL
            APP_ENVIRONMENT
            APP_RELEASE
            SITE_GATE_PASSWORD
            TRANSLATION_WORKSPACE_PASSWORD
            TRANSLATION_SESSION_SECRET
            TRANSLATION_DATABASE_SECRET
            AUTH_EMAIL_ENABLED
            AUTH_FACEBOOK_ENABLED
            MEMBER_ACTIVATION_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production input: ${name}" >&2
              exit 1
            fi
          done
          if [[ "${PUBLIC_SUPABASE_URL}" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo "The Supabase URL does not match the production project ref." >&2
            exit 1
          fi
          if [[ "${PUBLIC_APP_URL}" != "https://hundavaent.is" ]]; then
            echo "The production application URL must be the canonical domain." >&2
            exit 1
          fi
          if [[ "${APP_RELEASE}" != "${RELEASE_SHA}" ]]; then
            echo "APP_RELEASE must be the exact requested SHA." >&2
            exit 1
          fi
          if [[ "${AUTH_EMAIL_ENABLED}" != "false" || \
              "${AUTH_FACEBOOK_ENABLED}" != "false" ]]; then
            echo "Production Auth providers must remain disabled while managed Auth recovery is excluded." >&2
            exit 1
          fi
          if [[ ! "${MEMBER_ACTIVATION_SECRET}" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "The Member activation secret must be high-entropy base64url." >&2
            exit 1
          fi
          if [[ "${TRANSLATION_WORKSPACE_PASSWORD}" != "${SITE_GATE_PASSWORD}" ]]; then
            echo "The v1 translation workspace password must reuse the provisional site gate password." >&2
            exit 1
          fi
          if [[ ! "${TRANSLATION_SESSION_SECRET}" =~ ^[A-Za-z0-9_-]{43,}$ ]] || \
              [[ ! "${TRANSLATION_DATABASE_SECRET}" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "Translation session and database secrets must be high-entropy base64url." >&2
            exit 1
          fi
          if [[ "${PUBLIC_MAP_STYLE_URL}" != https://api.maptiler.com/* ]] || [[ "${PUBLIC_MAP_STYLE_URL}" != *"?key="* && "${PUBLIC_MAP_STYLE_URL}" != *"&key="* ]]; then
            echo "The production map style must use an authenticated MapTiler URL." >&2
            exit 1
          fi
          if [[ "${PUBLIC_SUPABASE_URL,,}" == *fundid* ]] || [[ "${PUBLIC_APP_URL,,}" == *fundid* ]]; then
            echo "Fundid resources are not valid Hundavaent production inputs." >&2
            exit 1
          fi

      - name: Check and build the Cloudflare artifact
        run: pnpm check && pnpm build

      - name: Configure encrypted production runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/hundavaent-pages-production-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          jq -n \
            --arg supabase_url "${PUBLIC_SUPABASE_URL}" \
            --arg supabase_key "${PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --arg map_style_url "${PUBLIC_MAP_STYLE_URL}" \
            --arg app_url "${PUBLIC_APP_URL}" \
            --arg posthog_token "${PUBLIC_POSTHOG_TOKEN}" \
            --arg posthog_host "${PUBLIC_POSTHOG_HOST}" \
            --arg app_environment "${APP_ENVIRONMENT}" \
            --arg app_release "${APP_RELEASE}" \
            --arg gate_password "${SITE_GATE_PASSWORD}" \
            --arg translation_workspace_password "${TRANSLATION_WORKSPACE_PASSWORD}" \
            --arg translation_session_secret "${TRANSLATION_SESSION_SECRET}" \
            --arg translation_database_secret "${TRANSLATION_DATABASE_SECRET}" \
            --arg auth_email_enabled "${AUTH_EMAIL_ENABLED}" \
            --arg auth_facebook_enabled "${AUTH_FACEBOOK_ENABLED}" \
            --arg member_activation_secret "${MEMBER_ACTIVATION_SECRET}" \
            '{
              PUBLIC_SUPABASE_URL: $supabase_url,
              PUBLIC_SUPABASE_PUBLISHABLE_KEY: $supabase_key,
              PUBLIC_MAP_STYLE_URL: $map_style_url,
              PUBLIC_APP_URL: $app_url,
              PUBLIC_POSTHOG_TOKEN: $posthog_token,
              PUBLIC_POSTHOG_HOST: $posthog_host,
              APP_ENVIRONMENT: $app_environment,
              APP_RELEASE: $app_release,
              SITE_GATE_PASSWORD: $gate_password,
              TRANSLATION_WORKSPACE_PASSWORD: $translation_workspace_password,
              TRANSLATION_SESSION_SECRET: $translation_session_secret,
              TRANSLATION_DATABASE_SECRET: $translation_database_secret,
              AUTH_EMAIL_ENABLED: $auth_email_enabled,
              AUTH_FACEBOOK_ENABLED: $auth_facebook_enabled,
              MEMBER_ACTIVATION_SECRET: $member_activation_secret
            }' > "${secrets_file}"
          chmod 600 "${secrets_file}"
          pnpm exec wrangler pages secret bulk "${secrets_file}" \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}"

      - name: Deploy the exact SHA to production
        run: |
          pnpm exec wrangler pages deploy .svelte-kit/cloudflare \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${RELEASE_SHA}" \
            --commit-message "Deploy ${RELEASE_SHA}" \
            --upload-source-maps

      - name: Verify coherent production readiness
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/verify-production-readiness.ts \
            "${PRODUCTION_URL}" \
            "${RELEASE_SHA}"
          {
            echo "### Hundavaent production"
            echo
            echo "- URL: ${PRODUCTION_URL}"
            echo "- Health: ready"
            echo "- Gate: active"
            echo "- Interface translations: published"
            echo "- Translation workspace: password boundary ready"
            echo "- Commit: ${RELEASE_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

  finalize-translation-capability:
    name: Retire the previous translation capability
    needs: deploy
    if: >-
      ${{
        github.event_name == 'workflow_run' ||
        (
          inputs.deploy &&
          !inputs.activate_achievement_milestones &&
          !inputs.activate_trusted_contributor
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
      TRANSLATION_DATABASE_SECRET: ${{ secrets.HUNDAVAENT_PRODUCTION_TRANSLATION_DATABASE_SECRET }}
    steps:
      - name: Retire the previous capability after healthy deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${TRANSLATION_DATABASE_SECRET}" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "The interface translation database secret must be high-entropy base64url." >&2
            exit 1
          fi
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          psql \
            -v ON_ERROR_STOP=1 \
            "${db_url}" <<'SQL'
          \getenv translation_database_secret TRANSLATION_DATABASE_SECRET
          select public.retire_previous_interface_translation_capability(
            :'translation_database_secret'
          );
          SQL
          echo "The previous interface translation capability was retired after health verification."

  activate-achievement-milestones:
    name: Activate Achievement milestones
    needs: recovery-point
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_achievement_milestones }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_URL: ${{ vars.HUNDAVAENT_PRODUCTION_APP_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
    steps:
      - name: Require a standalone activation of the exact live release
        shell: bash
        env:
          REQUESTED_MIGRATE: ${{ inputs.migrate }}
          REQUESTED_DEPLOY: ${{ inputs.deploy }}
          REQUESTED_TRUST_ACTIVATION: ${{ inputs.activate_trusted_contributor }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_MIGRATE}" != "false" || \
                "${REQUESTED_DEPLOY}" != "false" || \
                "${REQUESTED_TRUST_ACTIVATION}" != "false" ]]; then
            echo "Achievement activation must run separately with migrate=false, deploy=false, and activate_trusted_contributor=false." >&2
            exit 1
          fi
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          health="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/health")"
          test "$(jq -r '.status' <<< "${health}")" = "ok"
          test "$(jq -r '.release' <<< "${health}")" = "${RELEASE_SHA}"

      - name: Activate and verify the approved milestone policy
        shell: bash
        run: |
          set -euo pipefail
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          psql -X -q -v ON_ERROR_STOP=1 "${db_url}" <<'SQL'
          begin;
          set local role service_role;
          select public.configure_achievement_policy(
            'achievement-milestones-v1',
            15,
            true
          );
          commit;
          SQL
          policy="$(
            psql -X -qAt -v ON_ERROR_STOP=1 "${db_url}" <<'SQL'
          select concat_ws(
            '|',
            policy.policy_version,
            policy.credit_spacing_minutes,
            policy.enabled,
            policy.eligibility_started_at is not null
          )
          from private.achievement_policy as policy
          where policy.singleton;
          SQL
          )"
          test "${policy}" = "achievement-milestones-v1|15|t|t"
          public_enabled="$(
            psql -X -qAt -v ON_ERROR_STOP=1 "${db_url}" <<'SQL'
          begin;
          set local role anon;
          select enabled from public.get_achievement_feature_status();
          rollback;
          SQL
          )"
          test "${public_enabled}" = "t"
          {
            echo "### Achievement milestone activation"
            echo
            echo "- Commit: ${RELEASE_SHA}"
            echo "- Policy: achievement-milestones-v1"
            echo "- Credit spacing: 15 minutes"
            echo "- Eligibility: future-only boundary established"
            echo "- Public feature status: enabled"
          } >> "${GITHUB_STEP_SUMMARY}"

  activate-trusted-contributor:
    name: Activate Trusted Contributor
    needs: recovery-point
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_trusted_contributor }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_URL: ${{ vars.HUNDAVAENT_PRODUCTION_APP_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.HUNDAVAENT_PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.HUNDAVAENT_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
    steps:
      - name: Require a standalone activation of the exact live release
        shell: bash
        env:
          REQUESTED_MIGRATE: ${{ inputs.migrate }}
          REQUESTED_DEPLOY: ${{ inputs.deploy }}
          REQUESTED_ACHIEVEMENT_ACTIVATION: ${{ inputs.activate_achievement_milestones }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_MIGRATE}" != "false" || \
                "${REQUESTED_DEPLOY}" != "false" || \
                "${REQUESTED_ACHIEVEMENT_ACTIVATION}" != "false" ]]; then
            echo "Trusted Contributor activation must run separately with migrate=false, deploy=false, and activate_achievement_milestones=false." >&2
            exit 1
          fi
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          health="$(curl --fail --silent --show-error "${PRODUCTION_URL}/api/health")"
          test "$(jq -r '.status' <<< "${health}")" = "ok"
          test "$(jq -r '.release' <<< "${health}")" = "${RELEASE_SHA}"

      - name: Activate and verify the approved Trusted Contributor policy
        shell: bash
        run: |
          set -euo pipefail
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          psql -X -q -v ON_ERROR_STOP=1 "${db_url}" <<'SQL'
          begin;
          set local role service_role;
          select public.configure_contributor_status_policy(
            'trusted-contributor-v1',
            5,
            12,
            3,
            3,
            0,
            true
          );
          commit;
          SQL
          policy="$(
            psql -X -qAt -v ON_ERROR_STOP=1 "${db_url}" <<'SQL'
          select concat_ws(
            '|',
            policy.policy_version,
            policy.trusted_minimum_net_accepted,
            policy.trusted_window,
            policy.trusted_minimum_distinct_months,
            policy.trusted_minimum_distinct_subjects,
            policy.trusted_maximum_revoked_in_window,
            policy.enabled,
            reconciliation.missing_unlocks
          )
          from private.contributor_status_policy as policy
          cross join lateral (
            select count(*) as missing_unlocks
            from private.member_accounts as member_account
            cross join lateral private.compute_contributor_status(member_account.user_id) as status
            where status.status = 'trusted_contributor'
              and not exists (
                select 1
                from private.achievement_unlocks as unlock
                where unlock.member_id = member_account.user_id
                  and unlock.achievement_key = 'sustained_quality_contributor'
              )
          ) as reconciliation
          where policy.singleton;
          SQL
          )"
          test "${policy}" = "trusted-contributor-v1|5|1 year|3|3|0|t|0"
          {
            echo "### Trusted Contributor activation"
            echo
            echo "- Commit: ${RELEASE_SHA}"
            echo "- Policy: trusted-contributor-v1"
            echo "- Qualification window: exact 12 calendar months"
            echo "- Minimum confirmed Contributions: 5"
            echo "- Minimum active months: 3"
            echo "- Minimum distinct subjects: 3"
            echo "- Maximum revocations in window: 0"
            echo "- Existing qualifying Members: reconciled through immutable Achievement unlocks"
            echo "- Missing permanent recognitions after reconciliation: 0"
          } >> "${GITHUB_STEP_SUMMARY}"
